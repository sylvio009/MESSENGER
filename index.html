<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie Privée — Plateforme Sécurisée</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js" defer></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-alt: #273549;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }

        /* Connexion & Statut */
        .center-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); }
        .card h1 { font-size: 1.5rem; margin-bottom: 0.4rem; text-align: center; }
        .card p.subtitle { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }

        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; background: var(--bg); padding: 0.3rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.6rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: #fff; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn { width: 100%; padding: 0.75rem 1rem; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-sm { width: auto; padding: 0.4rem 0.75rem; font-size: 0.8rem; border-radius: 6px; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }

        .alert { padding: 0.75rem; border-radius: 8px; font-size: 0.88rem; margin-top: 1rem; line-height: 1.4; }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; }
        .alert-warning { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: #fcd34d; }

        /* Barre supérieure */
        header.topbar {
            background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.85rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;
        }
        .brand { font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; }
        .nav-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .badge { padding: 0.2rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
        .badge-admin { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid var(--primary); }
        .badge-pending { background: var(--warning); color: #000; }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .badge-blocked { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

        /* Section Messagerie */
        #chat-section { flex: 1; display: grid; grid-template-columns: 290px 1fr; height: calc(100vh - 62px); overflow: hidden; }
        .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
        .users-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .user-item {
            display: flex; align-items: center; justify-content: space-between; padding: 0.75rem;
            border-radius: 8px; cursor: pointer; margin-bottom: 0.3rem; transition: 0.15s;
        }
        .user-item:hover { background: var(--surface-alt); }
        .user-item.active { background: var(--primary); color: #fff; }
        .user-avatar {
            width: 34px; height: 34px; border-radius: 50%; background: var(--surface-alt);
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; margin-right: 0.65rem;
        }
        .user-item.active .user-avatar { background: rgba(255,255,255,0.2); }
