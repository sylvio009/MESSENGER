<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie Sécurisée</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- BARRE DE NAVIGATION -->
  <header class="bg-indigo-600 text-white shadow-md px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight">DirectMsg</h1>
    <div id="nav-user-info" class="hidden flex items-center gap-4">
      <span id="current-user-badge" class="bg-indigo-800 px-3 py-1 rounded-full text-sm font-medium"></span>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-medium transition">
        Déconnexion
      </button>
    </div>
  </header>

  <!-- CONTENEUR PRINCIPAL -->
  <main class="flex-1 flex items-center justify-center p-4">

    <!-- 1. ÉCRAN CONNEXION / INSCRIPTION -->
    <div id="auth-section" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <div class="flex border-b mb-6">
        <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 pb-3 font-semibold border-b-2 border-indigo-600 text-indigo-600">
          Connexion
        </button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 pb-3 font-semibold text-slate-400">
          Créer un compte
        </button>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nom d'utilisateur</label>
          <input type="text" id="auth-username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="ex: jean_dupont" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Mot de passe</label>
          <input type="password" id="auth-password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
        </div>
        <div id="auth-message" class="text-sm font-medium hidden p-3 rounded"></div>
        <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
          Se connecter
        </button>
      </form>
    </div>

    <!-- 2. ESPACE UTILISATEUR (MESSAGERIE) -->
    <div id="user-dashboard" class="hidden w-full max-w-5xl bg-white rounded-xl shadow-lg overflow-hidden grid grid-cols-1 md:grid-cols-3 h-[75vh]">
      
      <!-- Liste des contacts autorisés -->
      <div class="border-r bg-slate-50 flex flex-col">
        <div class="p-4 border-b font-semibold text-slate-700 bg-slate-100">
          Utilisateurs disponibles
        </div>
        <ul id="contacts-list" class="flex-1 overflow-y-auto divide-y"></ul>
      </div>

      <!-- Zone de conversation -->
      <div class="md:col-span-2 flex flex-col">
        <div id="chat-header" class="p-4 border-b font-semibold text-slate-700 bg-white">
          Sélectionnez un utilisateur pour discuter
        </div>
        <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50"></div>
        <form id="message-form" onsubmit="sendMessage(event)" class="p-4 border-t bg-white flex gap-2 hidden">
          <input type="text" id="message-input" required placeholder="Écrivez votre message..." class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium transition">
            Envoyer
          </button>
        </form>
      </div>
    </div>

    <!-- 3. PANNEAU ADMINISTRATEUR -->
    <div id="admin-dashboard" class="hidden w-full max-w-6xl space-y-6">
      
      <!-- Gestion des comptes -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-bold mb-4 text-slate-800 border-b pb-2">Gestion et Autorisation des Comptes</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-sm">
                <th class="p-3">Utilisateur</th>
                <th class="p-3">Mot de passe</th>
                <th class="p-3">Statut</th>
                <th class="p-3">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-users-table" class="divide-y text-sm"></tbody>
          </table>
        </div>
      </div>

      <!-- Supervision globale des messages -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-bold mb-4 text-slate-800 border-b pb-2">Supervision Globale des Messages (Temps Réel)</h2>
        <div id="admin-messages-feed" class="max-h-80 overflow-y-auto space-y-2 text-sm bg-slate-50 p-4 rounded-lg border"></div>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
